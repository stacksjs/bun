name: Track upstream

# A new official Bun release should become a release here without anyone
# asking. Every six hours: read the latest official tag, and if this
# repository has no release built from it, start one.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the patch queue
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find an official release this repository has not built
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(patches/*.patch)
          if (( ${#patches[@]} == 0 )); then
            # Nothing of ours to add: the official binary is the same thing.
            echo "patches/ is empty, so there is nothing to build."
            exit 0
          fi
          tag="$(gh api repos/oven-sh/bun/releases/latest --jq .tag_name)"
          echo "latest official release: $tag"
          # Ours are named <official tag>-stacks.<n>.
          built="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -c "^${tag}-stacks\." || true)"
          # One attempt per official tag per state of the patch queue. A build
          # that failed (a patch that no longer applies, a runner out of
          # memory) is not retried every six hours: it is retried when the
          # queue changes, or by hand.
          tried="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --limit 100 --json headSha,displayTitle --jq "[.[] | select(.headSha == \"$GITHUB_SHA\") | select(.displayTitle | contains(\"$tag\"))] | length")"
          echo "releases built from it here: $built, builds of it at this commit: $tried"
          if [ "$built" = "0" ] && [ "$tried" = "0" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the build
        if: steps.find.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" -f tag="${{ steps.find.outputs.tag }}" -f publish=true
